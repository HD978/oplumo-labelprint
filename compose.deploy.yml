# Production: one image, the server serves the built designer SPA. Headless, intranet.
#   docker compose -f compose.deploy.yml up -d      ->  http://<host>:5179
#
# Uses the prebuilt multi-arch image from GHCR. To build from source instead
# (local modifications), swap `image:` for the `build:` block below and run
# with --build.
services:
  labelprint:
    image: ghcr.io/xingrz/labelprint:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   target: runtime
    container_name: labelprint
    restart: unless-stopped
    ports:
      - 5179:5179
    volumes:
      - ./data:/data # templates / print targets / history
    # --- Printing (pick what matches your wiring) ---
    # A) Network target (raw 9100): nothing here — add a network target in the UI.
    # B) USB on this host, write the device directly:
    # devices:
    #   - '/dev/usb/lp0:/dev/usb/lp0'
    # C) Host CUPS raw queue:
    # environment:
    #   - CUPS_SERVER=host.docker.internal:631
    # extra_hosts:
    #   - 'host.docker.internal:host-gateway'
